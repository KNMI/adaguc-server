[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adaguc"
version = "0.0.3"
description = "Python support and FastAPI application for adaguc-server"
requires-python = ">=3.14"
authors = [{name = "KNMI Geospatial Task Force", email = "gstf@knmi.nl"}]
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
# Runtime dependencies are installed from requirements.txt before this package.
dependencies = []

[project.urls]
Homepage = "https://github.com/KNMI/adaguc-server"

[tool.setuptools.packages.find]
where = ["python"]
include = ["adaguc*"]
namespaces = false

[tool.setuptools.package-data]
adaguc = ["*.xml"]
"adaguc.fastapi_server.routers" = ["templates/ogcapi/*.html", "static/*.css", "static/renderjson/*"]

[tool.black]
line-length = 140
target-version = ["py314"]
include = '^tests/.*\.py$'
force-exclude = '^(?!tests/)'
